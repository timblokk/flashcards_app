{% extends "cards/base_cards.html" %}
{% block content %}
    <h2>Log in</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <input type="hidden" name="next" value="{{ next }}">
        <button type="submit">Log in</button>
    </form>
    <p>New here? <a href="{% url 'signup' %}">Create an account</a>.</p>
{% endblock %}
