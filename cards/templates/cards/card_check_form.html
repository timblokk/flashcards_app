<form method="post">
    {% csrf_token %}
    <input type="hidden" name="card_id" value="{{ card.id }}">
    <input type="hidden" name="solved" value="{{ solved }}">
    {% if solved %}
        <button class="button button-known" type="submit">I knew it</button>
    {% else %}
        <button class="button button-again" type="submit">
            {% if practice_only %}Repeat this card{% else %}Practice again{% endif %}
        </button>
    {% endif %}
</form>
