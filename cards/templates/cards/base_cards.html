<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f5f6fb">
    <title>{% block title %}Flashcards{% endblock %}</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'cards/css/app.css' %}">
</head>
<body>
    <header class="site-header">
        <div class="header-inner">
            <a class="brand" href="{% if user.is_authenticated %}{% url 'card-list' %}{% else %}{% url 'login' %}{% endif %}">
                <span class="brand-mark" aria-hidden="true">f</span>
                <span>flashcards<span class="brand-period">.</span></span>
            </a>
            {% include "cards/navigation.html" %}
        </div>
    </header>
    <main class="page-shell">
        {% if messages %}
            <div class="messages" role="status">
                {% for message in messages %}
                    <p class="message {{ message.tags }}">{{ message }}</p>
                {% endfor %}
            </div>
        {% endif %}
        {% block content %}
            <h1>Learn one card at a time.</h1>
        {% endblock content %}
    </main>
    <footer class="site-footer">A little progress, every day.</footer>
</body>
</html>
