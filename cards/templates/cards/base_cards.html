<!DOCTYPE html>
<html lang="fr">
<head>
    <title>Flashcards</title>
    <link rel="stylesheet" href="https://cdn.simplecss.org/simple.min.css">
</head>
<style>
    /* Custom CSS */
    :root {
        --accent: #6e48ad;
        --accent-bg: white;
        --bg: #fff;
        --text: #212121;
        --text-light: #585858;
        --border: #d8dae1;
        --code: #d81b60;
        --preformatted: #444;
    }
    article {
        background-color: var(--marked);
        border: 1px solid var(--border);
        border-radius: 5px;
        padding: 3em;
        margin: 1em 0;
    }
    h2 {
        text-align: center;
    }
    h2, h4 {
        margin-top: 0;
    }
    hr {
        background: var(--accent);
        border-color: var(--accent);
    }
    button,
    a[role="button"] {
        color: white;
        text-decoration: none;
    }
    input, select, textarea {
        width: 100%;
    }
    .dictionary-suggestions {
        border: 1px solid var(--border);
        max-height: 16rem;
        overflow-y: auto;
        margin-top: -0.5rem;
        margin-bottom: 1rem;
    }
    button.dictionary-suggestion {
        display: flex;
        justify-content: space-between;
        gap: 1rem;
        width: 100%;
        padding: 0.65rem 0.8rem;
        border: 0;
        border-bottom: 1px solid var(--border);
        border-radius: 0;
        background: var(--bg);
        color: var(--text);
        text-align: left;
        cursor: pointer;
    }
    button.dictionary-suggestion:hover,
    button.dictionary-suggestion:focus-visible {
        background: #eef4f2;
        color: var(--text);
    }
    .dictionary-headword {
        font-weight: 700;
    }
    .dictionary-translation {
        direction: rtl;
        text-align: right;
    }
    .vocalized-answer {
        direction: rtl;
        font-size: 1.2rem;
    }
    nav form {
        display: inline;
    }
    nav button {
        width: auto;
    }
    .field-error,
    .form-errors {
        color: #b00020;
    }
    .field-error {
        display: block;
        margin-top: 0.25rem;
    }
    .messages {
        color: #176b32;
    }
    .messages .warning {
        color: #805500;
    }
</style>
<body>
    <header>
        <h1>Flashcards App</h1>
        {% include "cards/navigation.html" %}
    </header>
    <main>
        {% if messages %}
            <ul class="messages" role="status">
                {% for message in messages %}
                    <li class="{{ message.tags }}">{{ message }}</li>
                {% endfor %}
            </ul>
        {% endif %}
        {% block content %}
            <h2>Bienvenue chez le meilleur Flashcards app dans le monde!</h2>
        {% endblock content %}
    </main>
</body>
</html>
